<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB Chatbot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #007bff;
        }
        p {
            font-size: 1.1rem;
            color: #555;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            background-color: #e7f3ff;
            border-radius: 4px;
            font-weight: bold;
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>USB Chatbot</h1>
        <p>Your portable AI companion, living on your USB drive.</p>
        <div class="status">Status: Ready to chat!</div>
    </div>
</body>
</html>
